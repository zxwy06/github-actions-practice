name: Python单元测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装测试依赖
        run: python -m pip install -r requirements.txt
      - name: 运行单元测试
        run: python -m pytest -v
